# Transformer archetype
model_name: vit_b16
timm_name: vit_base_patch16_224.augreg_in1k
# ^ CONTROL-CRITICAL: timm's DEFAULT tag for this model is
#   augreg_in21k_ft_in1k — ImageNet-21k pre-training, which would break the
#   "identical pre-training source (ImageNet-1k)" requirement of the study.
#   The .augreg_in1k tag (Steiner et al., "How to train your ViT") is trained
#   on ImageNet-1k only. Verified available in timm 1.0.27 (2026-07-04).

lr: null                # SET BY the declared 3-point LR sweep. Do not guess.
micro_batch_size: 32    # AMP + grad accumulation mandatory on 8 GB VRAM
grad_accum_steps: 2     # 32 x 2 = 64 = effective_batch_size (base.yaml)
# ^ Measured on the RTX 4060 8 GB (2026-08-21): 32x2 peaks at 3.3 GB and ~90 img/s,
#   vs 16x4 at 2.3 GB and ~67 img/s. Chose 32x2 for the 34% throughput gain with
#   ample headroom. This split is memory bookkeeping ONLY — the effective batch
#   stays 64, so the optimization protocol is identical to ResNet-50's.

# Declared fallback if ViT-B/16 proves infeasible on 8 GB / small data:
# deit_small_patch16_224.fb_in1k — ImageNet-1k only by construction.
# Switching is a documented finding, not a failure.
