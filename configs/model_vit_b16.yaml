# Transformer archetype
model_name: vit_b16
timm_name: vit_base_patch16_224.augreg_in1k
# ^ CONTROL-CRITICAL: timm's DEFAULT tag for this model is
#   augreg_in21k_ft_in1k — ImageNet-21k pre-training, which would break the
#   "identical pre-training source (ImageNet-1k)" requirement of the study.
#   The .augreg_in1k tag (Steiner et al., "How to train your ViT") is trained
#   on ImageNet-1k only. Verified available in timm 1.0.27 (2026-07-04).

lr: 0.0001
# ^ Set by the declared 4-point LR sweep (2026-08-21; f100, seed 0, 8 epochs,
#   AdamW, effective batch 64) — selection is by best val top-1, never test:
#     1e-05 -> 0.8553   3e-05 -> 0.8960   0.0001 -> 0.9037 (best)   0.0003 -> 0.8650
#   The grid was EXTENDED beyond the original 3 declared points because the
#   first winner landed on an edge — an under-tuned model would otherwise
#   manufacture a result out of a tuning artefact.
#   The winner is an INTERIOR grid point, so the optimum is bracketed on
#   both sides rather than sitting at the edge of the search.
#   Full records: results/runs/vit_b16_*sweep-lr*/ and results/tables/lr_sweep.csv
micro_batch_size: 32    # AMP + grad accumulation mandatory on 8 GB VRAM
grad_accum_steps: 2     # 32 x 2 = 64 = effective_batch_size (base.yaml)
# ^ Measured on the RTX 4060 8 GB (2026-08-21): 32x2 peaks at 3.3 GB and ~90 img/s,
#   vs 16x4 at 2.3 GB and ~67 img/s. Chose 32x2 for the 34% throughput gain with
#   ample headroom. This split is memory bookkeeping ONLY — the effective batch
#   stays 64, so the optimization protocol is identical to ResNet-50's.

# Declared fallback if ViT-B/16 proves infeasible on 8 GB / small data:
# deit_small_patch16_224.fb_in1k — ImageNet-1k only by construction.
# Switching is a documented finding, not a failure.

probe_lr: 1.0e-3
# ^ Linear-probe learning rate, by the same declared-sweep discipline as the
#   fine-tuning LR above (f100, seed 0, cached frozen features, val only):
#     1e-4 -> 0.8145   1e-3 -> 0.8556 (best)   1e-2 -> 0.8529   1e-1 -> 0.8230
#   Winner is INTERIOR (interior on the first pass).
#   The two models' probe optima sit a DECADE apart (ResNet 1e-1, ViT 1e-3):
#   2048-d pooled CNN features and 768-d ViT features are differently scaled
#   and conditioned, so a shared probe LR is not the neutral choice it looks
#   like — it cost the ResNet probe ~1.3 pp. Sweeping per model here is the
#   same rule the fine-tuning arm already follows.
