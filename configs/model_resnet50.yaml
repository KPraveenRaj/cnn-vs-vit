# CNN archetype
model_name: resnet50
timm_name: resnet50.a1_in1k
# ^ ImageNet-1k supervised weights (timm default tag for resnet50). Declared
#   choice: pre-training source must match the ViT's — ImageNet-1k ONLY.

lr: 3.0e-4
# ^ Set by the declared 3-point LR sweep (2026-07-04; f100, seed 0, 8 epochs,
#   AdamW, effective batch 64) — winner is the interior grid point:
#     1e-4 -> 0.8708   3e-4 -> 0.8943 (best)   1e-3 -> 0.8903   (val top-1)
#   Full records: results/runs/resnet50_caltech256_f100_s0_fullft-sweep-lr*/

micro_batch_size: 64    # fits 8 GB at 224 with AMP (measured peak: 3.1 GB)
grad_accum_steps: 1     # micro_batch x accum must equal effective_batch_size (base.yaml)

probe_lr: 1.0e-1
# ^ Linear-probe learning rate, by the same declared-sweep discipline as the
#   fine-tuning LR above (f100, seed 0, cached frozen features, val only):
#     1e-4 -> 0.5160   1e-3 -> 0.8755   1e-2 -> 0.8883   1e-1 -> 0.8896 (best)   1.0 -> 0.8024
#   Winner is INTERIOR (extended twice: the winner sat at the top edge at 1e-2 and again at 1e-1, so the grid grew until 1.0 collapsed and bracketed it).
#   The two models' probe optima sit a DECADE apart (ResNet 1e-1, ViT 1e-3):
#   2048-d pooled CNN features and 768-d ViT features are differently scaled
#   and conditioned, so a shared probe LR is not the neutral choice it looks
#   like — it cost the ResNet probe ~1.3 pp. Sweeping per model here is the
#   same rule the fine-tuning arm already follows.
